services:
  - type: web
    name: whatsapp-gateway
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: WA_PROVIDER
        value: baileys
      - key: ANTI_BAN_MODE
        value: relaxed
      - key: DB_SYNC
        value: true
      - key: DATABASE_URL
        fromDatabase:
          name: whatsapp-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest

databases:
  - name: whatsapp-db
    plan: free
    databaseName: whatsapp_gateway
    user: whatsapp_admin
